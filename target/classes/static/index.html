<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Réplica Jitsi MVP - Vídeo + Chat</title>
    <script src="/js/sockjs.min.js"></script>
    <script src="/js/stomp.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; background-color: #1a1a1f; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background-color: #22222a; padding: 10px; border-bottom: 1px solid #333; text-align: center; }
        h2 { color: #00d2ff; margin: 0 0 5px 0; font-size: 22px; }
        .room-info { color: #aaa; font-size: 13px; }

        .main-layout { display: flex; flex: 1; height: calc(100vh - 140px); overflow: hidden; }

        /* Área de Vídeo Principal */
        .video-area { flex: 3; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
        .video-container { display: flex; justify-content: center; gap: 20px; width: 100%; max-width: 1000px; flex-wrap: wrap; }
        .video-box { background: #262632; padding: 8px; border-radius: 12px; box-shadow: 0 6px 12px rgba(0,0,0,0.4); flex: 1; min-width: 300px; }
        .video-box h3 { margin: 5px 0 8px 0; font-size: 14px; color: #bbb; text-align: center; }
        video { width: 100%; height: 260px; background: #111; border-radius: 8px; object-fit: cover; transform: scaleX(-1); }
        #remoteVideo { transform: scaleX(1); }

        /* Panel Lateral de Chat (Estilo Jitsi) */
        .chat-panel { flex: 1; min-width: 280px; max-width: 360px; background-color: #22222a; border-left: 1px solid #333; display: flex; flex-direction: column; box-sizing: border-box; }
        .chat-header { padding: 15px; border-bottom: 1px solid #333; font-weight: bold; color: #00d2ff; text-align: left; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; text-align: left; background: #1a1a1f; display: flex; flex-direction: column; gap: 10px; }
        .chat-messages p { margin: 0; padding: 8px 12px; border-radius: 8px; background: #2c2c38; font-size: 14px; line-height: 1.4; word-break: break-word; }
        .chat-messages .my-msg { background: #007bff; align-self: flex-end; }
        .chat-input-area { padding: 12px; border-top: 1px solid #333; display: flex; gap: 8px; background: #22222a; }
        .chat-input-area input { flex: 1; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #111; color: white; font-size: 14px; }
        .chat-input-area input:focus { border-color: #00d2ff; outline: none; }
        .chat-input-area button { background: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .chat-input-area button:hover { background: #0056b3; }

        /* Barra Inferior de Controles */
        .controls-bar { height: 70px; background-color: #22222a; border-top: 1px solid #333; display: flex; justify-content: center; align-items: center; gap: 15px; box-sizing: border-box; }
        .btn { padding: 10px 20px; font-size: 14px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; }
        .btn-start { background: #007bff; color: white; }
        .btn-start:hover { background: #0056b3; }
        .btn-mute { background: #555562; color: white; }
        .btn-mute:hover { background: #666675; }
        .btn-mute.active { background: #dc3545; }
        .btn-hangup { background: #dc3545; color: white; display: none; }
        .btn-hangup:hover { background: #bd2130; }
    </style>
</head>
<body>

<header>
    <h2>📹 Réplica Jitsi MVP</h2>
    <div class="room-info" id="roomInfo">Conectando...</div>
</header>

<div class="main-layout">
    <!-- Panel Izquierdo: Videollamada -->
    <div class="video-area">
        <div class="video-container">
            <div class="video-box">
                <h3>Mi Cámara (Local)</h3>
                <video id="localVideo" autoplay playsinline muted></video>
            </div>
            <div class="video-box">
                <h3>Participante (Remoto)</h3>
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
        </div>
    </div>

    <!-- Panel Derecho: Chat Escrito -->
    <div class="chat-panel">
        <div class="chat-header">Chat de la Sala</div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-area">
            <input type="text" id="textMessageInput" placeholder="Escribe un mensaje al grupo..." onkeypress="handleKeyPress(event)">
            <button onclick="sendTextMessage()">Enviar</button>
        </div>
    </div>
</div>

<!-- Barra de Herramientas -->
<div class="controls-bar">
    <button id="callButton" class="btn btn-start" onclick="startCall()">Iniciar Videollamada</button>
    <button id="muteAudioButton" class="btn btn-mute" onclick="toggleAudio()">Silenciar Micro</button>
    <button id="muteVideoButton" class="btn btn-mute" onclick="toggleVideo()">Apagar Cámara</button>
    <button id="hangupButton" class="btn btn-hangup" onclick="hangUp()">Colgar</button>
</div>

<script>
    let stompClient = null;
    let localStream = null;
    let peerConnection = null;
    const roomId = "sala1";
    const username = "User_" + Math.floor(Math.random() * 100);

    let isAudioMuted = false;
    let isVideoMuted = false;

    const rtcConfig = { iceServers: [] };

    window.onload = async () => {
        await initCamera();
        connectWebSocket();
    };

    async function initCamera() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById("localVideo").srcObject = localStream;
            document.getElementById("roomInfo").innerText = `Identificado como: ${username} | Sala activa: ${roomId}`;
        } catch (e) {
            console.error("Dispositivos no disponibles: ", e);
            document.getElementById("roomInfo").innerText = "Error: Permisos multimedia denegados.";
        }
    }

    function connectWebSocket() {
        const socket = new SockJS('/ws-signaling');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, function () {
            stompClient.subscribe('/topic/sala.' + roomId, function (response) {
                const message = JSON.parse(response.body);

                // Si el mensaje es tipo 'CHAT', lo mostramos en pantalla (No importa el emisor)
                if (message.type === 'CHAT') {
                    displayTextMessage(message);
                }
                // Si es un mensaje de control WebRTC y no es nuestro, lo procesa el motor de vídeo
                else if (message.sender !== username) {
                    handleSignalingMessage(message);
                }
            });
        });
    }

    // --- Lógica del Chat Escrito (Sprint 1 Restaurado) ---
    function sendTextMessage() {
        const input = document.getElementById("textMessageInput");
        const text = input.value.trim();

        if (text && stompClient) {
            const textMessage = {
                sender: username,
                content: text,
                type: 'CHAT'
            };
            stompClient.send("/app/chat." + roomId, {}, JSON.stringify(textMessage));
            input.value = "";
        }
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendTextMessage();
        }
    }

    function displayTextMessage(message) {
        const messagesDiv = document.getElementById("chatMessages");
        const p = document.createElement("p");

        if (message.sender === username) {
            p.classList.add("my-msg");
            p.innerHTML = `<strong>Tú:</strong> ${message.content}`;
        } else {
            p.innerHTML = `<strong>${message.sender}:</strong> ${message.content}`;
        }

        messagesDiv.appendChild(p);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // --- Lógica del Motor de Vídeo WebRTC (Sprint 2 y 3) ---
    function setupPeerConnection() {
        peerConnection = new RTCPeerConnection(rtcConfig);

        // CORRECCIÓN AQUÍ: Accedemos al primer stream del array [0]
        peerConnection.ontrack = function (event) {
            console.log("Flujo remoto recibido correctamente.");
            if (event.streams && event.streams[0]) {
                document.getElementById("remoteVideo").srcObject = event.streams[0];
            }
        };

        peerConnection.onicecandidate = function (event) {
            if (event.candidate && stompClient) {
                const iceMessage = { sender: username, content: JSON.stringify(event.candidate), type: 'ICE' };
                stompClient.send("/app/chat." + roomId, {}, JSON.stringify(iceMessage));
            }
        };

        if (localStream) {
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });
        }
    }


    async function startCall() {
        setupPeerConnection();
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        const offerMessage = { sender: username, content: JSON.stringify(offer), type: 'OFFER' };
        stompClient.send("/app/chat." + roomId, {}, JSON.stringify(offerMessage));

        document.getElementById("callButton").style.display = "none";
        document.getElementById("hangupButton").style.display = "inline-block";
    }

    async function handleSignalingMessage(message) {
        if (message.type === 'OFFER') {
            setupPeerConnection();
            await peerConnection.setRemoteDescription(new RTCSessionDescription(JSON.parse(message.content)));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            const answerMessage = { sender: username, content: JSON.stringify(answer), type: 'ANSWER' };
            stompClient.send("/app/chat." + roomId, {}, JSON.stringify(answerMessage));
            document.getElementById("callButton").style.display = "none";
            document.getElementById("hangupButton").style.display = "inline-block";
        } else if (message.type === 'ANSWER') {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(JSON.parse(message.content)));
        } else if (message.type === 'ICE') {
            if (peerConnection) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(JSON.parse(message.content)));
            }
        } else if (message.type === 'HANGUP') {
            resetRemoteCall();
        }
    }
    function toggleAudio() {
        if (localStream) {
            isAudioMuted = !isAudioMuted;
            localStream.getAudioTracks().enabled = !isAudioMuted;
            const btn = document.getElementById("muteAudioButton");
            btn.innerText = isAudioMuted ? "Activar Micro" : "Silenciar Micro";
            btn.classList.toggle("active", isAudioMuted);
        }
    }
    // Control del estado de la Cámara
    // TSK-3.2: Control real y sincronizado del estado de la Cámara (WebRTC)
    function toggleVideo() {
        if (localStream && localStream.getVideoTracks().length > 0) {
            isVideoMuted = !isVideoMuted;

            // 1. Apagamos o encendemos la captura de la cámara localmente
            localStream.getVideoTracks()[0].enabled = !isVideoMuted;

            // 2. Buscamos el emisor de vídeo en la conexión activa y lo muteamos para el participante remoto
            if (peerConnection) {
                const videoSender = peerConnection.getSenders().find(sender => sender.track && sender.track.kind === 'video');
                if (videoSender && videoSender.track) {
                    videoSender.track.enabled = !isVideoMuted;
                }
            }

            // 3. Cambiamos el estado estético y feedback del botón
            const btn = document.getElementById("muteVideoButton");
            btn.innerText = isVideoMuted ? "Encender Cámara" : "Apagar Cámara";
            btn.classList.toggle("active", isVideoMuted);

            console.log(isVideoMuted ? "Cámara apagada y stream pausado." : "Cámara encendida y retransmitiendo.");
        }
    }
    function hangUp() {
        if (stompClient) {
            const hangupMessage = { sender: username, content: "Bye", type: 'HANGUP' };
            stompClient.send("/app/chat." + roomId, {}, JSON.stringify(hangupMessage));
        }
        resetRemoteCall();
    }
    function resetRemoteCall() {
        if (peerConnection) {
            peerConnection.close();
            peerConnection = null;
        }
        document.getElementById("remoteVideo").srcObject = null;
        document.getElementById("callButton").style.display = "inline-block";
        document.getElementById("hangupButton").style.display = "none";
    }
</script>
</body>
</html>
