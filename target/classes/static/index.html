<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sprint 2 - Motor de Video WebRTC</title>
    <script src="/js/sockjs.min.js"></script>
    <script src="/js/stomp.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f0f2f5; text-align: center; }
        .video-container { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        video { width: 45%; max-width: 500px; background: #222; border-radius: 8px; transform: scaleX(-1); }
        #remoteVideo { transform: scaleX(1); }
        .controls { margin-top: 20px; }
        button { padding: 12px 24px; font-size: 16px; font-weight: bold; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<h2>Réplica Jitsi MVP - Sprint 2</h2>

<div class="video-container">
    <div>
        <h3>Mi Cámara (Local)</h3>
        <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div>
        <h3>Participante (Remoto)</h3>
        <video id="remoteVideo" autoplay playsinline></video>
    </div>
</div>

<div class="controls">
    <button id="callButton" onclick="startCall()">Iniciar Videollamada</button>
</div>

<script>
    let stompClient = null;
    let localStream = null;
    let peerConnection = null;
    const roomId = "sala1";
    const username = "User_" + Math.floor(Math.random() * 100);

    // Configuración limpia y vacía para desarrollo local (Localhost)
    // Al estar vacía, elimina cualquier fallo de parseo de nombres de host (Invalid hostname format)
    const rtcConfig = {
        iceServers: []
    };

    window.onload = async () => {
        await initCamera();
        connectWebSocket();
    };

    async function initCamera() {
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById("localVideo").srcObject = localStream;
            console.log("Cámara y micrófono inicializados.");
        } catch (e) {
            console.error("Error al acceder a dispositivos: ", e);
            alert("Sugerencia: Conecta una cámara o comprueba los permisos del navegador.");
        }
    }

    function connectWebSocket() {
        const socket = new SockJS('/ws-signaling');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, function () {
            console.log('Conectado al servidor de señalización de Spring Boot.');

            stompClient.subscribe('/topic/sala.' + roomId, function (response) {
                const message = JSON.parse(response.body);
                if (message.sender !== username) {
                    handleSignalingMessage(message);
                }
            });
        });
    }

    function setupPeerConnection() {
        peerConnection = new RTCPeerConnection(rtcConfig);

        peerConnection.ontrack = function (event) {
            console.log("Flujo remoto recibido correctamente.");
            document.getElementById("remoteVideo").srcObject = event.streams[0];
        };

        peerConnection.onicecandidate = function (event) {
            if (event.candidate && stompClient) {
                const iceMessage = {
                    sender: username,
                    content: JSON.stringify(event.candidate),
                    type: 'ICE'
                };
                stompClient.send("/app/chat." + roomId, {}, JSON.stringify(iceMessage));
            }
        };

        if (localStream) {
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });
        }
    }

    async function startCall() {
        console.log("Enviando OFFER técnica...");
        setupPeerConnection();

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        const offerMessage = {
            sender: username,
            content: JSON.stringify(offer),
            type: 'OFFER'
        };
        stompClient.send("/app/chat." + roomId, {}, JSON.stringify(offerMessage));
    }

    async function handleSignalingMessage(message) {
        if (message.type === 'OFFER') {
            console.log("Recibida OFFER, respondiendo con ANSWER...");
            setupPeerConnection();
            const remoteOffer = JSON.parse(message.content);
            await peerConnection.setRemoteDescription(new RTCSessionDescription(remoteOffer));

            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            const answerMessage = {
                sender: username,
                content: JSON.stringify(answer),
                type: 'ANSWER'
            };
            stompClient.send("/app/chat." + roomId, {}, JSON.stringify(answerMessage));

        } else if (message.type === 'ANSWER') {
            console.log("Recibida ANSWER. Cerrando negociación.");
            const remoteAnswer = JSON.parse(message.content);
            await peerConnection.setRemoteDescription(new RTCSessionDescription(remoteAnswer));

        } else if (message.type === 'ICE') {
            const candidateData = JSON.parse(message.content);
            if (peerConnection) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(candidateData));
            }
        }
    }
</script>
</body>
</html>
